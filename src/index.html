<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>致知</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <img class="brand-mark" src="mark.svg" alt="" />
        <div class="brand-text">
          <span class="brand-name">致知</span>
          <span class="brand-sub">学以致知，孜孜不倦</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item is-active" data-view="today">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7" /></svg>
          <span>开始</span>
        </button>
        <button class="nav-item" data-view="insight">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l3-4 3 3 4-6" /></svg>
          <span>看板</span>
        </button>
        <button class="nav-item" data-view="learn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7v14H4zM13 5h7v14h-7z" /></svg>
          <span>学习</span>
        </button>
        <button class="nav-item" data-view="exam">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM9 9h6M9 13h4" /></svg>
          <span>练习</span>
        </button>
        <button class="nav-item" data-view="quiz">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v16H7zM10 8h4M10 12h4M10 16h2" /></svg>
          <span>考试</span>
        </button>
        <button class="nav-item" data-view="shelf">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h9a3 3 0 013 3v13H8a3 3 0 01-3-3z" /><path d="M17 7h2v13h-2" /><path d="M9 4v6l2-1.5L13 10V4" /></svg>
          <span>书架</span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" /><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2 2 2 0 11-4 0 1.7 1.7 0 00-2.9-1.2l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.7 1.7 0 003 15a2 2 0 010-4 1.7 1.7 0 001.2-2.9l-.1-.1a2 2 0 112.8-2.8l.1.1A1.7 1.7 0 0010 4.6a2 2 0 014 0 1.7 1.7 0 002.9 1.2l.1-.1a2 2 0 112.8 2.8l-.1.1A1.7 1.7 0 0021 11a2 2 0 010 4z" /></svg>
          <span>设置</span>
        </button>
      </nav>

      <div class="rail-foot">
        <div class="rail-stat">
          <span class="rail-stat-value" id="railDue">0</span>
          <span class="rail-stat-label">今日待办</span>
        </div>
        <div class="rail-stat">
          <span class="rail-stat-value" id="railStreak">0</span>
          <span class="rail-stat-label">连续天数</span>
        </div>
        <div class="rail-model" id="railModel">连接中</div>
      </div>
    </aside>

    <main class="stage">
      <header class="topbar">
        <h1 class="view-title" id="viewTitle">开始</h1>
        <div class="topbar-meta" id="topMetrics"></div>
      </header>

      <!-- 今日 -->
      <section class="view is-active" data-view="today">
        <div class="today-scroll">
          <div class="today-top">
            <div class="block" id="todayFocus"></div>
            <div class="block" id="chapterBlock">
              <div class="block-head">
                <h2>章节进度</h2>
                <span class="block-hint" id="chapterHint"></span>
              </div>
              <div class="chapter-list" id="chapterList"></div>
            </div>
          </div>

          <div class="block chart-card today-retention">
            <div class="block-head"><h2>记忆保持率</h2></div>
            <div class="retention-stats" id="retentionStats"></div>
            <div class="chart-canvas" id="retentionChart"></div>
          </div>

          <div class="today-bottom">
            <div class="block today-todo">
              <div class="block-head">
                <h2>今天要做</h2>
                <span class="block-hint" id="dueHint"></span>
              </div>
              <div class="list list-compact todo-list" id="dueList"></div>
            </div>
            <div class="block chart-card">
              <div class="block-head"><h2>未来 30 天到期</h2></div>
              <div class="chart-canvas" id="dueChart"></div>
            </div>
          </div>
        </div>

        <div class="today-actions">
          <button class="btn btn-primary" data-action="go-learn">学习</button>
          <button class="btn" data-action="go-review">复习</button>
          <button class="btn" data-action="go-exam">考试</button>
        </div>
      </section>

      <section class="view" data-view="shelf">
        <div class="grid-book">
          <div class="block book-main">
            <div class="shelf-head">
              <div class="tabs" id="shelfTabs">
                <button class="tab is-active" data-shelf-tab="search">在线搜索</button>
                <button class="tab" data-shelf-tab="local">本地导入</button>
              </div>
            </div>

            <div id="bookPane"></div>

            <div id="importPane" hidden>
            <label class="field">
              <span class="field-label">链接或主题</span>
              <div class="field-row">
                <input id="urlInput" type="text"
                       placeholder="粘贴文章链接，或直接写想学的主题，例如：RAG 分块策略" />
                <button class="btn btn-primary" id="urlBtn">智能导入</button>
              </div>
            </label>

            <label class="field">
              <span class="field-label">本地文件</span>
              <div class="dropzone" id="dropzone">
                <input type="file" id="fileInput" hidden
                       accept=".pdf,.docx,.md,.markdown,.txt" />
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M8 8l4-4 4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" /></svg>
                <span class="dropzone-title">把文件拖到这里，或点击选择</span>
                <span class="dropzone-sub">PDF、Word、Markdown、纯文本都行</span>
              </div>
            </label>

            <label class="field">
              <span class="field-label">直接粘贴文本</span>
              <textarea id="textInput" rows="5" placeholder="把课程讲义、笔记或文章正文粘贴进来"></textarea>
              <div class="field-row field-row-end">
                <input id="textTitle" class="input-slim" type="text" placeholder="材料标题（可留空）" />
                <button class="btn" id="textBtn">用这段文本</button>
              </div>
            </label>
            </div>
          </div>

          <div class="block book-side" id="bookSide">
            <div class="block-head"><h2>书架</h2></div>
            <div class="list" id="shelfList"></div>
            <div class="block-head" id="tocHead" hidden><h2>目录</h2></div>
            <div class="book-toc" id="bookToc"></div>
          </div>
        </div>
      </section>

      <!-- 学习 -->
      <section class="view" data-view="learn">
        <div class="study-drawer">
          <div class="study-tools">
            <label class="tool-field">
              <span class="tool-label">素材库</span>
              <span class="select-wrap">
                <svg class="select-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7v14H4zM13 5h7v14h-7z" /></svg>
                <select id="learnMaterial" title="切换素材库"></select>
                <svg class="select-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
              </span>
            </label>
            <label class="tool-field tool-grow">
              <span class="tool-label">搜索</span>
              <span class="search-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M16.5 16.5L21 21" /></svg>
                <input id="learnSearch" type="text" placeholder="搜索单元标题" />
              </span>
            </label>
            <button class="btn btn-slim tool-filter" id="learnFilter" type="button"
              aria-pressed="false" title="只看已经学过的单元">只看已学</button>
          </div>
        </div>
        <div class="grid-study">
          <aside class="study-side">
            <div class="block-head"><h2>学习单元</h2></div>
            <div class="list list-compact" id="learnQueue"></div>
          </aside>
          <div class="block study-card" id="learnCard"></div>
        </div>
      </section>

      <!-- 练习 -->
      <section class="view" data-view="exam">
        <div class="exam-tabs">
          <div class="tabs" id="examTabs">
            <button class="tab is-active" data-exam-tab="practice">练习</button>
            <button class="tab" data-exam-tab="wrong">错题</button>
          </div>
          <div class="seg exam-mode" id="practiceMode">
            <button class="seg-item is-active" data-mode="random">随机练习</button>
            <button class="seg-item" data-mode="unit">指定单元练习</button>
          </div>
        </div>

        <div class="grid-exam" id="practiceWrap">
          <div class="col-main" id="practiceMain"></div>
          <div class="col-side" id="practiceSide"></div>
        </div>

        <div class="grid-review" id="unitWrap" hidden>
          <aside class="review-side">
            <div class="block-head"><h2>学习单元</h2></div>
            <div class="list list-compact" id="unitList"></div>
          </aside>

          <div class="grid-exam review-main">
            <div class="block">
              <div class="block-head">
                <h2 id="examHeading">题目</h2>
                <span class="block-hint" id="examSource"></span>
              </div>
              <p class="exam-question" id="examQuestion">从左侧选一个单元开始</p>
              <div id="examNotesPanel"></div>
              <label class="field">
                <span class="field-label">你的回答</span>
                <textarea id="examAnswer" rows="9" placeholder="用自己的话作答，讲清机制、取舍与实践"></textarea>
              </label>
              <div class="field-row field-row-end">
                <span class="kbd-hint">Ctrl + Enter 提交</span>
                <button class="btn btn-primary" id="gradeBtn">提交并评判</button>
              </div>
            </div>
            <div class="col-side">
              <div class="block">
                <div class="block-head"><h2>自评复习</h2></div>
                <p class="block-note" id="selfNote">答完题由模型评分并自动排期；也可直接自评四档。</p>
                <div class="rate-grid" id="rateGrid">
                  <button class="btn btn-rate" data-rating="1">忘记</button>
                  <button class="btn btn-rate" data-rating="2">有点难</button>
                  <button class="btn btn-rate" data-rating="3">记得</button>
                  <button class="btn btn-rate" data-rating="4">太简单</button>
                </div>
              </div>
              <div class="block" id="gradeBlock" hidden>
                <div class="block-head"><h2>评判结果</h2><span class="score-pill" id="scorePill"></span></div>
                <div id="gradeBody"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="block" id="wrongWrap" hidden>
          <div class="block-head">
            <h2>错题</h2>
            <span class="block-hint" id="wrongHint"></span>
          </div>
          <div class="list" id="wrongList"></div>
        </div>
      </section>

      <!-- 测验 -->
      <section class="view" data-view="quiz">
        <div class="grid-quiz">
          <div class="col-main" id="quizMain"></div>
          <div class="col-side" id="quizSide"></div>
        </div>
        <div class="block" id="quizHistory">
          <div class="block-head">
            <h2>考试记录</h2>
            <span class="block-hint" id="quizHistoryHint"></span>
          </div>
          <div class="list list-compact" id="quizHistoryList"></div>
        </div>
      </section>

      <!-- 设置 -->
      <section class="view" data-view="settings">
        <div class="settings-scroll">
          <div class="settings-column">
            <div class="block">
              <button class="setting-row" type="button" data-drawer="llm" data-focus="sApiBase">
                <span class="setting-label">模型接口</span>
                <span class="setting-value" id="valueLlm">未填写</span>
                <svg class="setting-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
              </button>
              <button class="setting-row" type="button" data-drawer="proxy" data-focus="sProxyUrl">
                <span class="setting-label">网络代理</span>
                <span class="setting-value" id="valueProxy">未填写</span>
                <svg class="setting-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
              </button>
            </div>

            <div class="block">
              <div class="switch-row">
                <span class="switch-name">学习提醒
                  <span class="info-dot" tabindex="0" data-tip="每天早九点后（或开机后）提醒一次，当天不重复。">!</span>
                </span>
                <div class="seg" id="notifySeg">
                  <button class="seg-item" data-notify="on">开启</button>
                  <button class="seg-item" data-notify="off">关闭</button>
                </div>
              </div>
              <div class="switch-row">
                <span class="switch-name">划词翻译
                  <span class="info-dot" tabindex="0" data-tip="学习页选中文字浮出翻译按钮，点它才请求；每次消耗 token，请求关闭思考。">!</span>
                </span>
                <div class="seg" id="translateSeg">
                  <button class="seg-item" data-translate="on">开启</button>
                  <button class="seg-item" data-translate="off">关闭</button>
                </div>
              </div>
              <div class="switch-row">
                <span class="switch-name">划词问答
                  <span class="info-dot" tabindex="0" data-tip="学习页选中段落后可以提问：白话回答 + 引导追问。每次提问消耗 token。">!</span>
                </span>
                <div class="seg" id="qaSeg">
                  <button class="seg-item" data-qa="on">开启</button>
                  <button class="seg-item" data-qa="off">关闭</button>
                </div>
              </div>
              <div class="switch-row">
                <span class="switch-name">开机自启
                  <span class="info-dot" tabindex="0" data-tip="登录 Windows 后自动打开致知，改动立即生效。">!</span>
                </span>
                <div class="seg" id="autostartSeg">
                  <button class="seg-item" data-auto="on">开启</button>
                  <button class="seg-item" data-auto="off">关闭</button>
                </div>
              </div>
            </div>

            <div class="block">
              <div class="block-head"><h2>数据位置</h2></div>
              <div class="block-note" id="dataDir">读取中</div>
            </div>
          </div>
        </div>

        <div class="save-bar">
          <button class="btn btn-primary" id="saveSettingsBtn">保存设置</button>
          <span class="save-hint" id="saveHint">保存后立刻生效，不需要重启</span>
        </div>

        <div class="settings-drawer" id="settingsDrawer" hidden>
          <div class="drawer-backdrop" data-drawer-close></div>
          <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
            <div class="drawer-head">
              <h2 id="drawerTitle">模型接口</h2>
              <button class="drawer-close" type="button" data-drawer-close aria-label="关闭">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
              </button>
            </div>
            <div class="drawer-body">
              <div id="drawerLlm">
                <label class="field">
                  <span class="field-label">API 地址</span>
                  <input id="sApiBase" type="text" placeholder="https://api.deepseek.com/v1" />
                </label>
                <label class="field">
                  <span class="field-label">API Key</span>
                  <div class="input-wrap">
                    <input id="sApiKey" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false" />
                    <button class="reveal-btn" type="button" data-reveal="sApiKey">显示</button>
                  </div>
                </label>
                <label class="field">
                  <span class="field-label">模型名</span>
                  <input id="sModel" type="text" placeholder="deepseek-chat" />
                </label>
                <div class="field-row field-row-end">
                  <button class="btn" id="testLlmBtn" type="button">测试连接</button>
                </div>
                <div class="result" id="llmResult" hidden></div>
              </div>

              <div id="drawerProxy" hidden>
                <div class="field">
                  <span class="field-label">代理模式</span>
                  <div class="seg" id="proxyMode">
                    <button class="seg-item" data-mode="auto">自动</button>
                    <button class="seg-item" data-mode="manual">手动</button>
                    <button class="seg-item" data-mode="off">不用代理</button>
                  </div>
                </div>
                <div class="field-row field-row-end">
                  <button class="btn" id="detectBtn" type="button">检测代理</button>
                </div>
                <div class="result" id="proxyResult">点「检测代理」，看看系统里有没有可用的代理。</div>
                <label class="field" style="margin-top: 16px">
                  <span class="field-label">代理地址</span>
                  <div class="field-row">
                    <input id="sProxyUrl" type="text" placeholder="http://127.0.0.1:10809" />
                    <button class="btn" id="testProxyBtn" type="button">测试</button>
                  </div>
                </label>
                <label class="field">
                  <span class="field-label">不走代理的域名</span>
                  <input id="sNoProxy" type="text" placeholder="localhost, 127.0.0.1, .internal" />
                </label>
                <div class="result" id="proxyTestResult" hidden></div>
              </div>
            </div>
            <div class="drawer-foot">
              <span class="field-hint">填完点「保存设置」生效</span>
              <button class="btn btn-primary" type="button" data-drawer-close>完成</button>
            </div>
          </aside>
        </div>
      </section>

      <!-- 看板 -->
      <section class="view" data-view="insight">
        <div class="graph-bar">
          <div class="tabs" id="graphTabs">
            <button class="tab is-active" data-graph="stage">阶段指导</button>
            <button class="tab" data-graph="knowledge">知识地图</button>
            <button class="tab" data-graph="plan">复习计划</button>
            <button class="btn btn-slim" id="exportBtn">导出 SVG</button>
          </div>
        </div>
        <div class="canvas" id="graphCanvas"></div>
      </section>
    </main>
  </div>

  <div class="select-actions" id="selectActions" hidden>
    <button class="select-action" id="transTrigger" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h9M8.5 3v2c0 4-2 7-5 9" /><path d="M5 9c1.5 3 4 5 7 6" /><path d="M13 21l4-10 4 10" /><path d="M14.6 17h4.8" /></svg>
      <span>翻译</span>
    </button>
    <button class="select-action" id="askTrigger" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" /><path d="M12 12.5v.01" /><path d="M9.8 8.6a2.4 2.4 0 1 1 4.2 1.4c-.6.7-1.8 1-1.8 2.3" /></svg>
      <span>提问</span>
    </button>
  </div>
  <div class="trans-pop" id="transPop" hidden>
    <div class="trans-pop-head">
      <span>翻译</span>
      <button class="trans-close" id="transClose" type="button" aria-label="关闭翻译">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>
    <div class="trans-body" id="transBody"></div>
  </div>

  <div class="qa-drawer" id="qaDrawer" hidden>
    <div class="drawer-backdrop" data-qa-close></div>
    <aside class="drawer-panel qa-panel" role="dialog" aria-modal="true" aria-labelledby="qaTitle">
      <div class="drawer-head qa-head">
        <div class="qa-head-text">
          <h2 id="qaTitle">段落问答</h2>
          <span class="qa-passage" id="qaPassage"></span>
        </div>
        <button class="drawer-close" type="button" data-qa-close aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div class="drawer-body qa-thread" id="qaThread"></div>
      <div class="qa-compose">
        <div class="qa-followups" id="qaFollowups" hidden></div>
        <div class="qa-input-row">
          <input id="qaInput" type="text" placeholder="问这段里不懂的地方…" />
          <button class="btn btn-slim qa-deep" id="qaDeepBtn" type="button" aria-pressed="false"
            title="开思考再答：慢一些，但更深">认真想想</button>
          <button class="btn btn-primary" id="qaSendBtn" type="button">发送</button>
        </div>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
